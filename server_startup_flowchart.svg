<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3000" viewBox="0 0 1800 3000">
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:52px;font-weight:700}.sub{font-size:24px;fill:#53657d}.head{font-size:27px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#43546b}.mono{font-family:Consolas,monospace;font-size:20px}.lane{fill:#f7f9fc;stroke:#d6deea;stroke-width:2;rx:26}.card{fill:#fff;stroke:#c7d2e1;stroke-width:2;rx:18}.blue{fill:#eaf3ff;stroke:#5b8def;stroke-width:3;rx:18}.green{fill:#e8f7ef;stroke:#42a875;stroke-width:3;rx:18}.amber{fill:#fff4dd;stroke:#e2a43a;stroke-width:3;rx:18}.purple{fill:#f2edff;stroke:#9173d1;stroke-width:3;rx:18}.red{fill:#fff0ef;stroke:#d77b75;stroke-width:3;rx:18}.arrow{fill:none;stroke:#526981;stroke-width:4;marker-end:url(#arr)}.dash{fill:none;stroke:#71839a;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arr)}.label{font-size:17px;font-weight:700;fill:#43546b}
</style><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#526981"/></marker></defs>
<rect width="1800" height="3000" fill="#f1f5fa"/>
<text x="900" y="78" text-anchor="middle" class="title">WHAT HAPPENS WHEN THE BANK SERVER RUNS</text>
<text x="900" y="120" text-anchor="middle" class="sub">Server process lifecycle • POSIX C • one forked worker process per client</text>

<rect x="55" y="155" width="1690" height="410" class="lane"/>
<text x="95" y="205" class="head">A · Start process and create shared account state</text>
<rect x="110" y="240" width="430" height="120" class="blue"/>
<text x="325" y="285" text-anchor="middle" class="head">Run executable</text><text x="325" y="325" text-anchor="middle" class="mono">./bankserver</text>
<rect x="680" y="240" width="470" height="120" class="purple"/>
<text x="915" y="285" text-anchor="middle" class="head">main()</text><text x="915" y="325" text-anchor="middle" class="body">clear worker PID slots; install signal handlers</text>
<rect x="1290" y="225" width="390" height="155" class="amber"/>
<text x="1485" y="266" text-anchor="middle" class="head">SIGINT / SIGTERM</text><text x="1485" y="305" text-anchor="middle" class="body">handler sets stopping flag</text><text x="1485" y="338" text-anchor="middle" class="small">used later to leave accept loop</text>
<path d="M540 300 H665" class="arrow"/><path d="M1150 300 H1275" class="dash"/>
<rect x="350" y="415" width="1100" height="110" class="green"/>
<text x="900" y="460" text-anchor="middle" class="head">create_shared_bank()</text>
<text x="900" y="497" text-anchor="middle" class="body">shmget(IPC_PRIVATE) → shmat() → zero Bank → process-shared pthread mutex</text>
<path d="M915 360 V400" class="arrow"/>

<rect x="55" y="595" width="1690" height="500" class="lane"/>
<text x="95" y="645" class="head">B · Create and prepare the listening socket</text>
<rect x="140" y="690" width="350" height="125" class="blue"/>
<text x="315" y="737" text-anchor="middle" class="head">socket()</text><text x="315" y="778" text-anchor="middle" class="body">IPv4 + TCP endpoint</text>
<rect x="555" y="690" width="350" height="125" class="purple"/>
<text x="730" y="737" text-anchor="middle" class="head">setsockopt()</text><text x="730" y="778" text-anchor="middle" class="body">SO_REUSEADDR</text>
<rect x="970" y="690" width="350" height="125" class="amber"/>
<text x="1145" y="737" text-anchor="middle" class="head">bind()</text><text x="1145" y="778" text-anchor="middle" class="body">all interfaces : TCP 1080</text>
<rect x="1385" y="690" width="300" height="125" class="green"/>
<text x="1535" y="737" text-anchor="middle" class="head">listen()</text><text x="1535" y="778" text-anchor="middle" class="body">backlog 20</text>
<path d="M490 752 H540" class="arrow"/><path d="M905 752 H955" class="arrow"/><path d="M1320 752 H1370" class="arrow"/>
<rect x="390" y="900" width="1020" height="125" class="green"/>
<text x="900" y="948" text-anchor="middle" class="head">Server is ready — enter accept loop</text>
<text x="900" y="988" text-anchor="middle" class="body">accept() blocks until a client connects; returns a new connected socket.</text>
<path d="M1535 815 V860 H1410 V935" class="arrow"/>

<rect x="55" y="1125" width="1690" height="910" class="lane"/>
<text x="95" y="1175" class="head">C · Handle a client connection</text>
<rect x="570" y="1210" width="660" height="115" class="blue"/>
<text x="900" y="1255" text-anchor="middle" class="head">accept() returns client socket</text>
<text x="900" y="1292" text-anchor="middle" class="body">Listening socket remains open for future clients.</text>
<path d="M900 1025 V1195" class="arrow"/>
<path d="M900 1325 V1370" class="arrow"/>
<polygon points="900,1370 1120,1460 900,1550 680,1460" fill="#fff4dd" stroke="#e2a43a" stroke-width="3"/>
<text x="900" y="1453" text-anchor="middle" class="head">free worker slot?</text><text x="900" y="1485" text-anchor="middle" class="small">reap_workers() checks exited children</text>
<path d="M680 1460 H410 V1580" class="arrow"/><text x="525" y="1445" class="label">NO</text>
<rect x="110" y="1580" width="600" height="140" class="red"/>
<text x="410" y="1625" text-anchor="middle" class="head">At client limit</text>
<text x="410" y="1665" text-anchor="middle" class="body">send “try again later” → close client socket</text>
<text x="410" y="1695" text-anchor="middle" class="small">then return to accept()</text>
<path d="M900 1550 V1580" class="arrow"/><text x="920" y="1575" class="label">YES</text>
<rect x="720" y="1580" width="370" height="140" class="purple"/>
<text x="905" y="1625" text-anchor="middle" class="head">fork()</text><text x="905" y="1665" text-anchor="middle" class="body">creates a child process</text><text x="905" y="1695" text-anchor="middle" class="small">parent and child get copies of FDs</text>
<path d="M1090 1650 H1200 V1580" class="arrow"/><text x="1128" y="1635" class="label">FORK ERROR</text>
<rect x="1120" y="1400" width="560" height="140" class="red"/>
<text x="1400" y="1445" text-anchor="middle" class="head">fork() failed</text><text x="1400" y="1485" text-anchor="middle" class="body">close connected socket; parent keeps running</text><text x="1400" y="1515" text-anchor="middle" class="small">next accept() iteration</text>
<path d="M1090 1635 H1360 V1545" class="arrow"/>
<rect x="95" y="1785" width="755" height="200" class="amber"/>
<text x="130" y="1830" class="head">PARENT PROCESS · server continues</text>
<text x="130" y="1870" class="body">Store child PID in workers[]</text><text x="130" y="1905" class="body">Close parent copy of connected client socket</text><text x="130" y="1940" class="body">Go back to accept() for another client</text>
<rect x="950" y="1785" width="755" height="200" class="green"/>
<text x="985" y="1830" class="head">CHILD PROCESS · serve this client</text>
<text x="985" y="1870" class="body">Close child copy of listening socket</text><text x="985" y="1905" class="body">Call serve_client(client_fd)</text><text x="985" y="1940" class="body">Shared-memory mapping remains available after fork()</text>
<path d="M850 1720 V1755 H470 V1770" class="arrow"/><text x="600" y="1747" class="label">PARENT fork() = child PID</text>
<path d="M960 1720 V1755 H1330 V1770" class="arrow"/><text x="1190" y="1747" class="label">CHILD fork() = 0</text>

<rect x="55" y="2065" width="1690" height="465" class="lane"/>
<text x="95" y="2115" class="head">D · Child serves commands; parent accepts more clients concurrently</text>
<rect x="105" y="2160" width="390" height="160" class="blue"/>
<text x="300" y="2205" text-anchor="middle" class="head">Read one command</text><text x="300" y="2245" text-anchor="middle" class="body">socket_read_line()</text><text x="300" y="2285" text-anchor="middle" class="small">newline ends each message</text>
<rect x="705" y="2160" width="390" height="160" class="amber"/>
<text x="900" y="2205" text-anchor="middle" class="head">Process command</text><text x="900" y="2245" text-anchor="middle" class="body">lock → validate/update → unlock</text><text x="900" y="2285" text-anchor="middle" class="small">shared Bank mutex + account owner PID</text>
<rect x="1305" y="2160" width="390" height="160" class="green"/>
<text x="1500" y="2205" text-anchor="middle" class="head">Send response</text><text x="1500" y="2245" text-anchor="middle" class="body">socket_write_line()</text><text x="1500" y="2285" text-anchor="middle" class="small">then read next command</text>
<path d="M495 2240 H690" class="arrow"/><path d="M1095 2240 H1290" class="arrow"/><path d="M1500 2320 V2370 H300 V2335" class="dash"/>
<text x="900" y="2400" text-anchor="middle" class="body">On exit, disconnect, or socket error: release active account → close client socket → _exit(0)</text>
<text x="900" y="2440" text-anchor="middle" class="small">Parent later reaps completed workers with waitpid(..., WNOHANG).</text>

<rect x="55" y="2560" width="1690" height="365" class="lane"/>
<text x="95" y="2610" class="head">E · Server shutdown and resource cleanup</text>
<rect x="110" y="2660" width="350" height="150" class="red"/><text x="285" y="2708" text-anchor="middle" class="head">Ctrl+C / SIGTERM</text><text x="285" y="2750" text-anchor="middle" class="body">set stopping flag</text>
<rect x="545" y="2660" width="350" height="150" class="blue"/><text x="720" y="2708" text-anchor="middle" class="head">Leave accept loop</text><text x="720" y="2750" text-anchor="middle" class="body">close listening socket</text>
<rect x="980" y="2660" width="350" height="150" class="amber"/><text x="1155" y="2708" text-anchor="middle" class="head">Stop worker processes</text><text x="1155" y="2750" text-anchor="middle" class="body">kill() then waitpid()</text>
<rect x="1415" y="2660" width="270" height="150" class="purple"/><text x="1550" y="2708" text-anchor="middle" class="head">Release IPC</text><text x="1550" y="2750" text-anchor="middle" class="body">destroy mutex</text><text x="1550" y="2780" text-anchor="middle" class="small">shmdt + shmctl(RMID)</text>
<path d="M460 2735 H530" class="arrow"/><path d="M895 2735 H965" class="arrow"/><path d="M1330 2735 H1400" class="arrow"/>
<text x="900" y="2890" text-anchor="middle" class="sub">Server listens on 0.0.0.0:1080 • account state is memory-only • this design uses processes, not client threads</text>
</svg>
